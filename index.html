<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" async></script>
</head>
<body>
    <div class ="calculator">
        
        <div class ="circles">
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
        
        <div class ="clear">
            <button>Clear</button>
        </div>

        <div class="display-container">
            <div class="display">
                
            </div>
        </div>
        
        <div class="buttons-container">

            <div class="buttons">
                <button class="nbr" id="seven">7</button>
                <button class="nbr" id="eight">8</button>
                <button class="nbr" id="nine">9</button>
                <button class="yellow operator" id="division">/</button>
                <button class="nbr" id="four">4</button>
                <button class="nbr" id="five">5</button>
                <button class="nbr" id="six">6</button>
                <button class="yellow operator" id="multiplication">x</button>
                <button class="nbr" id="one">1</button>
                <button class="nbr" id="two">2</button>
                <button class="nbr" id="three">3</button>
                <button class="yellow operator" id="subtraction">-</button>
                <button class="dot" id="decimal">.</button>
                <button class="nbr" id="zero">0</button>
                <button class="red" id="equal">=</button>
                <button class="yellow operator" id="sum">+</button>
            </div>
        </div>
            
    </div>
</body>
</html>

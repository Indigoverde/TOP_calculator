<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" async></script>
</head>
<body>
    <div class ="calculator">
        
        <div class ="circles">
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
        
        <div class ="clear">
            <button>Clear</button>
        </div>

        <div class="display-container">
            <div class="display">
                12345
            </div>
        </div>
        
        <div class="buttons-container">

            <div class="buttons">
                <button class="nbr">7</button>
                <button class="nbr">8</button>
                <button class="nbr">9</button>
                <button class="yellow">/</button>
                <button class="nbr">4</button>
                <button class="nbr">5</button>
                <button class="nbr">6</button>
                <button class="yellow">X</button>
                <button class="nbr">1</button>
                <button class="nbr">2</button>
                <button class="nbr">3</button>
                <button class="yellow">-</button>
                <button class="dot">.</button>
                <button class="nbr">0</button>
                <button class="red">=</button>
                <button class="yellow">+</button>
            </div>
        </div>
            
    </div>
</body>
</html>
